services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ciphercascade
      POSTGRES_USER: ciphercascade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ciphercascade"]
      interval: 5s
      timeout: 3s
      retries: 10
  relay:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://ciphercascade:local-only-change-me@db:5432/ciphercascade}
      APP_SECRET: ${APP_SECRET:-development-only-change-this-secret-32-bytes}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: ./frontend
    environment: ["VITE_API_URL=http://localhost:8000"]
    ports: ["5173:5173"]
    depends_on: [relay]
volumes:
  postgres_data:
