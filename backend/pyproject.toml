[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "ciphercascade-relay"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["fastapi==0.115.12", "uvicorn[standard]==0.34.0", "sqlalchemy==2.0.40", "psycopg[binary]==3.2.6", "cryptography==44.0.2", "PyNaCl==1.5.0", "pycryptodome==3.24.0", "pydantic==2.11.3"]
[project.optional-dependencies]
test = ["pytest==8.3.5", "httpx==0.28.1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
